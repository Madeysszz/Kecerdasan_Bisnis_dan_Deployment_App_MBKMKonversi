name: Norton Deployment CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deployment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deployment-aplikasi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            deployment-aplikasi/requirements.txt
            deployment-aplikasi/cloud-demo/requirements.txt

      - name: Install dependencies
        id: install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r cloud-demo/requirements.txt

      - name: Validate Python syntax
        id: syntax
        run: python -m compileall -q app.py tests scripts cloud-demo

      - name: Run pytest and Streamlit AppTest
        id: tests
        run: python -m pytest tests -q --junitxml=test-results/pytest.xml

      - name: Smoke test without private data
        id: smoke
        if: ${{ always() && steps.install.outcome == 'success' && steps.syntax.outcome == 'success' }}
        run: python scripts/smoke_test.py

      - name: Smoke test synthetic cloud demo
        id: cloud_smoke
        if: ${{ always() && steps.install.outcome == 'success' && steps.syntax.outcome == 'success' }}
        run: python scripts/smoke_cloud_demo.py

      - name: Write CI summary
        if: ${{ always() }}
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          SYNTAX_RESULT: ${{ steps.syntax.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          CLOUD_SMOKE_RESULT: ${{ steps.cloud_smoke.outcome }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Norton Deployment CI

          | Check | Result |
          | --- | --- |
          | Install dependencies | $INSTALL_RESULT |
          | Python syntax | $SYNTAX_RESULT |
          | pytest and Streamlit AppTest | $TEST_RESULT |
          | HTTP smoke without private data | $SMOKE_RESULT |
          | Synthetic cloud demo smoke | $CLOUD_SMOKE_RESULT |

          Tests use synthetic fixtures. No BI pipeline or model training runs in this workflow.
          Docker build and application hosting are outside this CI job.
          EOF

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: deployment-ci-reports
          path: deployment-aplikasi/test-results/
          if-no-files-found: warn
          retention-days: 14
